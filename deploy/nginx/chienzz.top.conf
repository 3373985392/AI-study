server {
    # 静态学习站与 Web Chat 页面入口。
    listen 80;
    listen [::]:80;
    server_name chienzz.top;

    root /var/www/chienzz.top;
    index index.html;

    # FastAPI 同源接口；关闭缓冲以保证 SSE 逐段抵达浏览器。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # VitePress cleanUrls 会生成无后缀链接，需要依次尝试 .html 和目录首页。
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    access_log /var/log/nginx/chienzz.top.access.log;
    error_log /var/log/nginx/chienzz.top.error.log;
}
